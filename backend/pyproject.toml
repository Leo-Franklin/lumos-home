[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.10.0,<4.0.0",
    "cryptography>=46.0.7",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mac-vendor-lookup>=0.1.15",
    "onvif-zeep>=0.2.12",
    "bcrypt>=5.0.0",
    "Pillow>=11.0.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "python-nmap>=0.7.1",
    "pystray>=0.19.0",
    "scapy>=2.7.0",
    "smbprotocol>=1.16.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
dev = "app.main:_dev"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
# TODO: enable B904, B008, B023, E731, F403, F821, F841, E402, DTZ incrementally
select = ["E", "F", "I", "COM", "FIX", "UP", "C4", "T10", "ISC"]
ignore = ["E501", "COM812", "ISC001", "F403", "F841", "E402", "B904", "B008", "B023", "E731"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
